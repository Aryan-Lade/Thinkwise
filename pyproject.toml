[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blind-spot"
version = "1.0.0"
description = "AI-powered thinking companion to identify blind spots in decision-making"
requires-python = ">=3.10"
authors = [{name = "Aryan Lade", email = "aryan.lade@example.com"}]
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "google-genai==0.3.0",
    "slowapi==0.1.8",
    "cachetools==5.3.0",
    "google-cloud-logging==3.4.0"
]

[tool.uv]
package = false

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "static*", "api*"]



[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.23.2",
    "httpx==0.25.0",
    "pytest-cov==4.1.0",
    "ruff==0.1.0",
    "black==23.9.1"
]

[tool.ruff]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E501", "C901"]
line-length = 120
target-version = "py312"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.py$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mox
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--tb=short"
]
covfailunder = 85